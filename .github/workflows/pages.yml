name: Everline · Verify and publish game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.3
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python tests/browser_art_smoke.py && python tests/browser_station_smoke.py && python tests/browser_living_smoke.py && python tests/browser_grand_smoke.py && python tests/browser_offline_smoke.py
      - run: python tests/browser_origin_smoke.py
      - run: node scripts/policy-stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everline-qa-evidence
          path: |
            docs/*results.json
            docs/v7-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: everline-website
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: everline-website
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
