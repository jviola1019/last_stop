<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#191824"/><meta name="description" content="An illustrated living train: build little rooms, meet travelers, discover worlds."/>
<title>LAST STOP: THE EVERLINE — Living Diorama Edition</title><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" type="image/svg+xml" href="./assets/icon.svg"/><link rel="stylesheet" href="./src/style.css"/></head>
<body><main class="stage" id="game">
  <canvas id="world" tabindex="0" aria-label="Living cutaway train. Swipe to browse rooms; tap a carriage to upgrade it. Left and right arrow keys move the view."></canvas>
  <header class="hud" aria-label="Train status">
    <div class="mobile-brand"><div class="brand-top">LAST STOP</div><div class="brand-sub">THE EVERLINE</div></div>
    <div class="resource-group"><div class="pill balance"><span class="coin-icon" aria-hidden="true">★</span><strong id="coins">160</strong><button id="collect" aria-label="Collect accumulated coins"><span>＋</span><small id="pending">+42</small></button></div>
    <div class="pill stamps"><span class="stamp-icon" aria-hidden="true">✉</span><strong id="stamps">0</strong></div>
    <div class="pill countdown"><span class="engine-icon" aria-hidden="true">♜</span><span class="arrival">Arrival in</span><strong id="eta">01:25</strong></div>
    <button class="settings" id="settings" title="Settings" aria-label="Open settings">⚙</button></div>
  </header>
  <div class="location-tag" id="location">ROSEWATER VALE · SUNSET EXPRESS</div>
  <section id="inspector" class="inspector" aria-label="Selected carriage and its upgrades"><div class="inspector-inner" id="inspector-inner"></div></section>
  <button class="sighting" id="sighting" hidden aria-label="Claim rare event reward">✦ A RARE SIGHTING <small>Tap to collect a postcard stamp</small></button>
  <p class="travel-tip" id="travel-tip">↔ DRAG THE TRAIN TO EXPLORE</p>
  <div class="tour" id="tour" role="status" aria-live="polite"></div>
  <nav class="nav" aria-label="Main game sections">
    <button class="nav-choice selected" data-page="train" aria-current="page"><span aria-hidden="true">♜</span>TRAIN</button>
    <button class="nav-choice" data-page="shop"><span aria-hidden="true">▤</span>SHOP</button>
    <button class="nav-choice" data-page="journal"><span aria-hidden="true">▣</span>JOURNAL</button>
  </nav>
  <dialog id="drawer" class="drawer" aria-label="Game menu"><div class="drawer-head"><div><div class="superline" id="drawer-kicker">THE EVERLINE</div><h2 id="drawer-title">The Shop</h2></div><button id="close-drawer" class="exit" aria-label="Close menu">✕</button></div><div class="drawer-body" id="drawer-body"></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-label="Settings"><div class="drawer-head"><div><div class="superline">EVERLINE · OPERATIONS</div><h2>Settings</h2></div><button class="exit" id="close-settings">✕</button></div><div class="settings-body" id="settings-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main><script type="module" src="./src/main.js"></script></body></html>
