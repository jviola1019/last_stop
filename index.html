<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#1b2634"/><meta name="description" content="An illustrated living train: build little rooms, meet travelers, discover worlds."/>
<title>LAST STOP: THE EVERLINE — Service Railway</title><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" type="image/svg+xml" href="./assets/icon.svg"/><link rel="icon" type="image/png" sizes="32x32" href="./assets/icon-32.png"/><link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png"/><link rel="stylesheet" href="./src/style.css"/></head>
<body><main class="stage" id="game">
  <canvas id="world" tabindex="0" aria-label="Living cutaway train. Swipe to browse rooms; tap a carriage to upgrade it. Left and right arrow keys move the view."></canvas>
  <header class="hud" aria-label="Train status"><div class="desktop-brand" aria-label="Last Stop: The Everline"></div>
    <div class="mobile-brand"><div class="brand-top">LAST STOP</div><div class="brand-sub">THE EVERLINE</div></div>
    <div class="resource-group"><div class="pill balance"><span class="coin-icon" aria-hidden="true">★</span><strong id="coins">160</strong><button id="collect" aria-label="Collect accumulated coins"><span>＋</span><small id="pending">+42</small></button></div>
    <div class="pill stamps"><span class="stamp-icon" aria-hidden="true"><svg class="stamp-glyph" viewBox="0 0 36 38" fill="none" aria-hidden="true"><path d="M6 3h24l3 5-3 4 3 4-3 4 3 4-3 4 2 6H4l2-6-3-4 3-4-3-4 3-4-2-5Z" fill="#f5ddae" stroke="#8b634d" stroke-width="1.8"/><rect x="9" y="9" width="18" height="19" fill="#87a8a8" stroke="#ad734d"/><path d="m10 25 7-9 4 5 4-7 2 11" fill="#486977"/><circle cx="14" cy="14" r="2" fill="#ffcf80"/></svg></span><strong id="stamps">0</strong></div>
    <div class="pill countdown"><span class="engine-icon" aria-hidden="true"><svg class="arrival-glyph" viewBox="0 0 56 48" fill="none" aria-hidden="true"><path d="M8 14h24v19H8zM13 8h6v6M6 33h34M35 19h9l7 8v6H35" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="14" cy="38" r="4" stroke="currentColor" stroke-width="3"/><circle cx="31" cy="38" r="4" stroke="currentColor" stroke-width="3"/><circle cx="46" cy="38" r="4" stroke="currentColor" stroke-width="3"/><path d="M13 19h6M23 19h5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span><span class="arrival">Arrival in</span><strong id="eta">01:25</strong></div>
    <button class="settings" id="settings" title="Settings" aria-label="Open settings"><svg viewBox="0 0 48 48" aria-hidden="true" class="settings-glyph"><path d="m20 4 8 0 2 5 5 2 5-2 4 7-4 4v8l4 4-4 7-5-2-5 2-2 5h-8l-2-5-5-2-5 2-4-7 4-4v-8l-4-4 4-7 5 2 5-2Z" fill="currentColor"/><circle cx="24" cy="24" r="8" fill="#292431"/></svg></button></div>
  </header>
  <div class="scenic-controls" aria-label="Scenic controls"><button id="scenic" type="button" aria-pressed="false" title="Watch the train without menus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Scenic view</span></button><button id="photo" type="button" hidden>Save postcard</button><button id="zoom-out" type="button" aria-label="Zoom out" hidden>−</button><button id="zoom-in" type="button" aria-label="Zoom in" hidden>+</button></div><div class="journey-ribbon" id="journey-status" role="status" aria-live="off">ON THE OPEN RAIL</div><div class="location-tag" id="location">ROSEWATER VALE · SUNSET EXPRESS</div>
  <section id="inspector" class="inspector" aria-label="Selected carriage and its upgrades"><div class="inspector-inner" id="inspector-inner"></div></section>
  <button class="sighting" id="sighting" hidden aria-label="Claim rare event reward">✦ A RARE SIGHTING <small>Tap to collect a postcard stamp</small></button>
  <p class="travel-tip" id="travel-tip">↔ DRAG THE TRAIN TO EXPLORE</p>
  <div class="tour" id="tour" role="status" aria-live="polite"></div>
  <nav class="nav" aria-label="Main game sections">
    <button class="nav-choice selected" data-page="train" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 64 48" fill="none" aria-hidden="true"><path d="M11 29V14h7v-5h18v5h6c5 0 8 5 8 10v10H7v-5h4Z" fill="currentColor"/><path d="M40 18h8M12 19h23M11 29h38" stroke="#30212a" stroke-width="2.5"/><path d="M19 7h4M28 7h4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M7 35h47" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="37" r="5" fill="#f0d1a0" stroke="#30212a" stroke-width="2"/><circle cx="33" cy="37" r="6" fill="#f0d1a0" stroke="#30212a" stroke-width="2"/><circle cx="49" cy="37" r="4" fill="#f0d1a0" stroke="#30212a" stroke-width="2"/><path d="M49 22h5l5 7v5H49" fill="currentColor"/></svg></span><span class="nav-label">TRAIN</span></button>
    <button class="nav-choice" data-page="shop"><span class="nav-icon" aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 18h32v24H8V18Z" stroke="currentColor" stroke-width="2.8"/><path d="M5 17 10 7h28l5 10-4 6c-2 2-6 2-8-1-2 3-5 3-7 0-3 3-6 3-8 0-2 3-5 3-8 1l-3-6Z" fill="currentColor" stroke="#39262c" stroke-width="1.4"/><path d="M18 42V29h12v13M10 7h28" stroke="currentColor" stroke-width="2.8"/><path d="M12 30h4" stroke="currentColor" stroke-width="2"/></svg></span><span class="nav-label">SHOP</span></button>
    <button class="nav-choice" data-page="journal"><span class="nav-icon" aria-hidden="true"><svg class="nav-glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 13C18 8 10 8 4 10v28c8-2 15-1 20 4 5-5 12-6 20-4V10c-6-2-14-2-20 3Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" fill="none"/><path d="M24 13v29M8 16c5-1 9 0 12 2M28 18c4-2 8-3 12-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nav-label">JOURNAL</span></button>
  </nav>
  <dialog id="drawer" class="drawer" aria-label="Game menu"><div class="drawer-head"><div><div class="superline" id="drawer-kicker">THE EVERLINE</div><h2 id="drawer-title">The Shop</h2></div><button id="close-drawer" class="exit" aria-label="Close menu">✕</button></div><div class="drawer-body" id="drawer-body"></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-label="Settings"><div class="drawer-head"><div><div class="superline">EVERLINE · OPERATIONS</div><h2>Settings</h2></div><button class="exit" id="close-settings" aria-label="Close settings">✕</button></div><div class="settings-body" id="settings-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main><script type="module" src="./src/main.js"></script></body></html>
